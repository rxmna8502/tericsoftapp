<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, Tericsoft!</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #000000;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 640px;
      padding: 40px;
      border: 1px solid #006aff;
      border-radius: 20px;
      background: #656d7c;
    }

    .label {
      color: #ffffffff;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 16px;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.1;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    code {
      color: #000000ff;
    }

    footer {
      border-top: 1px solid #334155;
      margin-top: 28px;
      padding-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <span class="label">DevOps internship demo</span>
    <h1>Hello, Tericsoft! </h1>
    <p>I'm Sai Ramana Ladi. Welcome to my Hello World app.</p>
    <p>This page is served by a small Node.js web server listening on port <code>8081</code>. The project includes a
      Dockerfile to run it in a container.</p>
    <footer>One page. One server. A starting point for cloud deployment.</footer>
  </main>
</body>

</html>
